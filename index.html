<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flashcards</title>

<style>
body {
    margin: 0;
    background: #121212;
    color: white;
    font-family: system-ui;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    touch-action: pan-y;
}

.app {
    width: 100%;
    max-width: 600px;
    padding: 20px;
}

.card-wrapper {
    overflow: hidden;
}

.card {
    width: 100%;
    height: 45vh;
    background: #1e1e1e;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: clamp(1.5rem, 6vw, 2.5rem);
    padding: 20px;
    box-sizing: border-box;
    user-select: none;
    transition: transform 0.25s ease;
}

.counter {
    text-align: center;
    margin: 12px 0;
    opacity: 0.6;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
}

button {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: #2a2a2a;
    color: white;
    font-size: 14px;
}

button:active {
    transform: scale(0.95);
}

.add-btn {
    background: #b00020;
}

.add-btn:hover {
    background: #d00030;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
}

.modal-content {
    background: #1e1e1e;
    padding: 20px;
    border-radius: 12px;
    width: 90%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

textarea {
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    resize: none;
}

.build {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    opacity: 0.4;
}
</style>
</head>

<body>

<div class="app">

<div class="card-wrapper">
    <div class="card" id="card">Loading...</div>
</div>

<div class="counter" id="counter"></div>

<!-- TOP ROW -->
<div class="controls">
    <button onclick="previousCard()">Previous</button>
    <button onclick="shuffleCards()">Shuffle</button>
    <button onclick="nextCard()">Next</button>
</div>

<!-- BOTTOM ROW -->
<div class="controls">
    <button onclick="deleteCard()">Delete</button>
    <button onclick="openEdit()">Edit</button>
    <button class="add-btn" onclick="addCard()">❤️ Add</button>
</div>

<div class="build">
    BUILD: 2026-02-17-v8  
    <br>For my Wife, with Love Husband of yours ❤️
</div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="modal-content">
        <label>Front</label>
        <textarea id="editFront"></textarea>

        <label>Back</label>
        <textarea id="editBack"></textarea>

        <button onclick="saveEdit()">Save</button>
        <button id="clearBtn" onclick="clearField()">Clear</button>
        <button onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>

let cards = JSON.parse(localStorage.getItem("cards")) || [
    { front: "Capital of France?", back: "Paris" },
    { front: "2 + 2?", back: "4" }
];

let current = 0;
let showingFront = true;

const cardEl = document.getElementById("card");
const counterEl = document.getElementById("counter");
const modal = document.getElementById("modal");
const clearBtn = document.getElementById("clearBtn");

let lastCleared = null;

function save() {
    localStorage.setItem("cards", JSON.stringify(cards));
}

function showCard() {
    if (cards.length === 0) {
        cardEl.innerText = "No cards";
        counterEl.innerText = "";
        return;
    }

    cardEl.innerText = showingFront
        ? cards[current].front
        : cards[current].back;

    counterEl.innerText = `Card ${current + 1} of ${cards.length}`;
}

function flipCard() {
    showingFront = !showingFront;
    showCard();
}

function nextCard() {
    current = (current + 1) % cards.length;
    showingFront = true;
    showCard();
}

function previousCard() {
    current = (current - 1 + cards.length) % cards.length;
    showingFront = true;
    showCard();
}

function shuffleCards() {
    cards.sort(() => Math.random() - 0.5);
    current = 0;
    showingFront = true;
    save();
    showCard();
}

function addCard() {
    cards.push({ front: "", back: "" });
    current = cards.length - 1;
    showingFront = true;
    save();
    showCard();
    openEdit();
}

function deleteCard() {
    if (!confirm("Delete this card?")) return;
    cards.splice(current, 1);
    if (current >= cards.length) current = 0;
    save();
    showCard();
}

function openEdit() {
    document.getElementById("editFront").value = cards[current].front;
    document.getElementById("editBack").value = cards[current].back;
    clearBtn.innerText = "Clear";
    modal.style.display = "flex";
}

function closeModal() {
    modal.style.display = "none";
}

function saveEdit() {
    cards[current].front = document.getElementById("editFront").value;
    cards[current].back = document.getElementById("editBack").value;
    save();
    closeModal();
    showCard();
}

function clearField() {
    if (clearBtn.innerText === "Clear") {
        lastCleared = {
            front: document.getElementById("editFront").value,
            back: document.getElementById("editBack").value
        };
        document.getElementById("editFront").value = "";
        document.getElementById("editBack").value = "";
        clearBtn.innerText = "Undo";
    } else {
        document.getElementById("editFront").value = lastCleared.front;
        document.getElementById("editBack").value = lastCleared.back;
        clearBtn.innerText = "Clear";
    }
}

cardEl.addEventListener("click", flipCard);

/* CARD-ONLY SWIPE */
let startX = 0;
let currentX = 0;
let isDragging = false;

cardEl.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
    isDragging = true;
});

cardEl.addEventListener("touchmove", e => {
    if (!isDragging) return;
    currentX = e.touches[0].clientX;
    let diff = currentX - startX;
    cardEl.style.transform = `translateX(${diff}px)`;
});

cardEl.addEventListener("touchend", e => {
    isDragging = false;
    let diff = e.changedTouches[0].clientX - startX;

    if (diff > 80) {
        previousCard();
    } else if (diff < -80) {
        nextCard();
    }

    cardEl.style.transform = "translateX(0)";
});

showCard();

</script>

</body>
</html>
