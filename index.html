<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards</title>

<style>
body {
    margin: 0;
    background: #121212;
    color: white;
    font-family: system-ui;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.app {
    width: 100%;
    max-width: 600px;
    padding: 20px;
}

.card {
    width: 100%;
    height: 40vh;
    background: #1e1e1e;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 6vw;
    padding: 20px;
    box-sizing: border-box;
    user-select: none;
}

.counter {
    text-align: center;
    margin: 15px 0;
    opacity: 0.6;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
}

button {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: #2a2a2a;
    color: white;
    font-size: 14px;
}

.build {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    opacity: 0.4;
}
</style>
</head>

<body>

<div class="app">

    <div class="card" id="card">Loading...</div>

    <div class="counter" id="counter"></div>

    <div class="controls">
        <button onclick="previousCard()">Previous</button>
        <button onclick="nextCard()">Next</button>
        <button onclick="shuffleCards()">Shuffle</button>
        <button onclick="addCard()">Add</button>
        <button onclick="deleteCard()">Delete</button>
    </div>

    <div class="build">BUILD: 2026-02-17-v5</div>

</div>

<script>

let cards = JSON.parse(localStorage.getItem("cards")) || [
    { front: "Capital of France?", back: "Paris" },
    { front: "2 + 2?", back: "4" }
];

let current = 0;
let showingFront = true;

const cardEl = document.getElementById("card");
const counterEl = document.getElementById("counter");

function save() {
    localStorage.setItem("cards", JSON.stringify(cards));
}

function showCard() {
    if (cards.length === 0) {
        cardEl.innerText = "No cards";
        counterEl.innerText = "";
        return;
    }

    cardEl.innerText = showingFront
        ? cards[current].front
        : cards[current].back;

    counterEl.innerText = `Card ${current + 1} of ${cards.length}`;
}

function flipCard() {
    showingFront = !showingFront;
    showCard();
}

function nextCard() {
    current = (current + 1) % cards.length;
    showingFront = true;
    showCard();
}

function previousCard() {
    current = (current - 1 + cards.length) % cards.length;
    showingFront = true;
    showCard();
}

function shuffleCards() {
    cards.sort(() => Math.random() - 0.5);
    current = 0;
    showingFront = true;
    save();
    showCard();
}

function addCard() {
    let front = prompt("Front:");
    let back = prompt("Back:");
    if (front && back) {
        cards.push({ front, back });
        save();
        showCard();
    }
}

function deleteCard() {
    if (cards.length === 0) return;
    if (confirm("Delete this card?")) {
        cards.splice(current, 1);
        if (current >= cards.length) current = 0;
        save();
        showCard();
    }
}

cardEl.addEventListener("click", flipCard);

let startX = 0;

cardEl.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

cardEl.addEventListener("touchend", e => {
    let diff = e.changedTouches[0].clientX - startX;
    if (diff > 50) previousCard();
    if (diff < -50) nextCard();
});

showCard();

</script>

</body>
</html>
