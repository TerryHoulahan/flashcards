<script>
let cards = JSON.parse(localStorage.getItem("flashcards")) || [
    { front: "Capital of France?", back: "Paris" },
    { front: "2 + 2?", back: "4" }
];

let current = 0;
let showingFront = true;
let startX = 0;

const cardEl = document.getElementById("card");
const counterEl = document.getElementById("counter");

function saveCards() {
    localStorage.setItem("flashcards", JSON.stringify(cards));
}

function showCard() {
    if (cards.length === 0) {
        cardEl.innerText = "No cards. Add one.";
        counterEl.innerText = "";
        return;
    }

    cardEl.innerText = showingFront
        ? cards[current].front
        : cards[current].back;

    counterEl.innerText = `Card ${current + 1} of ${cards.length}`;
}

function flipCard() {
    showingFront = !showingFront;
    showCard();
}

function nextCard() {
    current = (current + 1) % cards.length;
    showingFront = true;
    showCard();
}

function previousCard() {
    current = (current - 1 + cards.length) % cards.length;
    showingFront = true;
    showCard();
}

function shuffleCards() {
    for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    current = 0;
    showingFront = true;
    saveCards();
    showCard();
}

function addCard() {
    let front = prompt("Front (question):");
    if (!front) return;

    let back = prompt("Back (answer):");
    if (!back) return;

    cards.push({ front, back });
    saveCards();
    current = cards.length - 1;
    showingFront = true;
    showCard();
}

cardEl.addEventListener("click", flipCard);

cardEl.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

cardEl.addEventListener("touchend", e => {
    let endX = e.changedTouches[0].clientX;
    let diff = endX - startX;

    if (diff > 50) {
        previousCard();
    } else if (diff < -50) {
        nextCard();
    }
});

showCard();
</script>

</body>

<head>

<title>Flashcards</title>

<style>
body {

.modal-content {
    background: #1c1c1c;
    padding: 20px;
    border-radius: 12px;
    width: 90%;
    max-width: 400px;

    flex-direction: column;

<body>

<div class="card" id="card">Loading...</div>

<div class="counter" id="counter"></div>

<div class="controls">
    <button onclick="previousCard()">Previous</button>
    <button onclick="nextCard()">Next</button>
    <button onclick="shuffleCards()">Shuffle</button>
    <button onclick="addCard()">Add</button>
    <button onclick="deleteCard()">Delete</button>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <label>Front</label>
        <textarea id="editFront"></textarea>
        <label>Back</label>
        <textarea id="editBack"></textarea>
        <button onclick="saveEdit()">Save</button>
        <button onclick="closeModal()">Cancel</button>
    </div>
</div>

<div class="build">
    BUILD: 2026-02-17-v3
</div>

<script>
const defaultCards = [
    { front: "Capital of France?", back: "Paris" },
    { front: "2 + 2?", back: "4" }
];

let cards = JSON.parse(localStorage.getItem("flashcards")) || defaultCards;

let current = 0;
let showingFront = true;
let startX = 0;
let holdTimer = null;

const cardEl = document.getElementById("card");
const counterEl = document.getElementById("counter");
const modal = document.getElementById("modal");

function saveCards() {
    localStorage.setItem("flashcards", JSON.stringify(cards));
}

function showCard() {
    if (cards.length === 0) {
        cardEl.innerText = "No cards. Add one.";
        counterEl.innerText = "";
        return;
    }

    cardEl.innerText = showingFront
        ? cards[current].front
        : cards[current].back;

    counterEl.innerText = `Card ${current + 1} of ${cards.length}`;
}

function flipCard() {
    showingFront = !showingFront;
    showCard();
}

function nextCard() {
    if (cards.length === 0) return;
    current = (current + 1) % cards.length;
    showingFront = true;
    showCard();
}

function previousCard() {
    if (cards.length === 0) return;
    current = (current - 1 + cards.length) % cards.length;
    showingFront = true;
    showCard();
}

function shuffleCards() {
    cards.sort(() => Math.random() - 0.5);
    current = 0;
    showingFront = true;
    saveCards();
    showCard();
}

function addCard() {
    cards.push({ front: "New Question", back: "New Answer" });
    current = cards.length - 1;
    showingFront = true;
    saveCards();
    showCard();
}

function deleteCard() {
    if (cards.length === 0) return;
    cards.splice(current, 1);
    current = Math.max(0, current - 1);
    saveCards();
    showCard();
}

function openModal() {
    document.getElementById("editFront").value = cards[current].front;
    document.getElementById("editBack").value = cards[current].back;
    modal.style.display = "flex";
}

function closeModal() {
    modal.style.display = "none";
}

function saveEdit() {
    cards[current].front = document.getElementById("editFront").value;
    cards[current].back = document.getElementById("editBack").value;
    saveCards();
    closeModal();
    showCard();
}

cardEl.addEventListener("click", flipCard);

cardEl.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
    holdTimer = setTimeout(openModal, 600);
});

cardEl.addEventListener("touchend", e => {
    clearTimeout(holdTimer);
    let endX = e.changedTouches[0].clientX;
    let diff = endX - startX;

    if (diff > 50) previousCard();
    else if (diff < -50) nextCard();
});

cardEl.addEventListener("mousedown", () => {
    holdTimer = setTimeout(openModal, 600);
});

cardEl.addEventListener("mouseup", () => {
    clearTimeout(holdTimer);
});

showCard();
</script>

</body>
