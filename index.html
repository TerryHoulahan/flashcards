<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards</title>

<style>
body {
    margin: 0;
    background: #121212;
    color: white;
    font-family: system-ui;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.app {
    width: 100%;
    max-width: 600px;
    padding: 20px;
}

.card {
    width: 100%;
    height: 45vh;
    background: #1e1e1e;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: clamp(1.5rem, 6vw, 2.5rem);
    padding: 20px;
    box-sizing: border-box;
    user-select: none;
    transition: transform 0.25s ease;
}

.counter {
    text-align: center;
    margin: 15px 0;
    opacity: 0.6;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
}

button {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: #2a2a2a;
    color: white;
    font-size: 14px;
}

button:hover {
    background: #333;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
}

.modal-content {
    background: #1c1c1c;
    padding: 20px;
    border-radius: 12px;
    width: 90%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

textarea {
    padding: 8px;
    border-radius: 6px;
    border: none;
    font-size: 14px;
    resize: none;
}

.build {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    opacity: 0.4;
}
</style>
</head>

<body>

<div class="app">

    <div class="card" id="card">Loading...</div>

    <div class="counter" id="counter"></div>

    <div class="controls">
        <button onclick="previousCard()">Previous</button>
        <button onclick="nextCard()">Next</button>
        <button onclick="shuffleCards()">Shuffle</button>
        <button onclick="addCard()">Add</button>
        <button onclick="deleteCard()">Delete</button>
        <button onclick="openEdit()">Edit</button>
    </div>

    <div class="build">
        For my Wife, with Love — Husband of Yours ❤️
    </div>

</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <label>Front</label>
        <textarea id="editFront"></textarea>
        <label>Back</label>
        <textarea id="editBack"></textarea>
        <button onclick="saveEdit()">Save</button>
        <button onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>

// ---------- DATA ----------
let cards = JSON.parse(localStorage.getItem("cards")) || [
    { front: "Capital of France?", back: "Paris" },
    { front: "2 + 2?", back: "4" }
];

let current = 0;
let showingFront = true;

const cardEl = document.getElementById("card");
const counterEl = document.getElementById("counter");
const modal = document.getElementById("modal");

// ---------- STORAGE ----------
function save() {
    localStorage.setItem("cards", JSON.stringify(cards));
}

// ---------- RENDER ----------
function showCard() {
    if (cards.length === 0) {
        cardEl.innerText = "No cards";
        counterEl.innerText = "";
        return;
    }

    cardEl.innerText = showingFront
        ? cards[current].front
        : cards[current].back;

    counterEl.innerText = `Card ${current + 1} of ${cards.length}`;
}

// ---------- CARD ACTIONS ----------
function flipCard() {
    showingFront = !showingFront;
    showCard();
}

function nextCard() {
    current = (current + 1) % cards.length;
    showingFront = true;
    showCard();
}

function previousCard() {
    current = (current - 1 + cards.length) % cards.length;
    showingFront = true;
    showCard();
}

function shuffleCards() {
    cards.sort(() => Math.random() - 0.5);
    current = 0;
    showingFront = true;
    save();
    showCard();
}

function addCard() {
    cards.push({ front: "", back: "" });
    current = cards.length - 1;
    showingFront = true;
    save();
    openEdit();
}

function deleteCard() {
    if (cards.length === 0) return;
    cards.splice(current, 1);
    if (current >= cards.length) current = 0;
    save();
    showCard();
}

// ---------- EDIT ----------
function openEdit() {
    // Auto-clear so typing starts fresh
    document.getElementById("editFront").value = "";
    document.getElementById("editBack").value = "";

    modal.style.display = "flex";
}

function closeModal() {
    modal.style.display = "none";
}

function saveEdit() {
    cards[current].front = document.getElementById("editFront").value;
    cards[current].back = document.getElementById("editBack").value;
    save();
    closeModal();
    showCard();
}

// ---------- SWIPE (Premium Drag) ----------
let startX = 0;
let currentX = 0;
let dragging = false;

cardEl.addEventListener("click", flipCard);

cardEl.addEventListener("touchstart", e => {
    dragging = true;
    startX = e.touches[0].clientX;
    cardEl.style.transition = "none";
});

cardEl.addEventListener("touchmove", e => {
    if (!dragging) return;
    currentX = e.touches[0].clientX;
    let diff = currentX - startX;
    cardEl.style.transform = `translateX(${diff}px)`;
});

cardEl.addEventListener("touchend", () => {
    if (!dragging) return;
    dragging = false;

    let diff = currentX - startX;
    cardEl.style.transition = "transform 0.25s ease";

    if (diff > 100) {
        cardEl.style.transform = "translateX(100%)";
        setTimeout(() => {
            previousCard();
            cardEl.style.transform = "translateX(0)";
        }, 200);
    }
    else if (diff < -100) {
        cardEl.style.transform = "translateX(-100%)";
        setTimeout(() => {
            nextCard();
            cardEl.style.transform = "translateX(0)";
        }, 200);
    }
    else {
        cardEl.style.transform = "translateX(0)";
    }
});

showCard();

</script>

</body>
</html>
