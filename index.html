<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flashcards</title>

<style>
body {
    margin: 0;
    background: #121212;
    color: white;
    font-family: system-ui;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    touch-action: manipulation;
}

.app {
    width: 100%;
    max-width: 600px;
    padding: 20px;
    box-sizing: border-box;
}

.card {
    width: 100%;
    height: 55vh;
    background: #1e1e1e;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: clamp(1.5rem, 5vw, 2.4rem);
    padding: 25px;
    box-sizing: border-box;
    user-select: none;
    position: relative;
    transition: transform 0.2s ease;
}

.counter {
    text-align: center;
    margin: 15px 0;
    opacity: 0.6;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
}

button {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: #2a2a2a;
    color: white;
    font-size: 14px;
}

button:active {
    background: #3a3a3a;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
}

.modal-content {
    background: #1e1e1e;
    padding: 20px;
    border-radius: 12px;
    width: 90%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.modal textarea {
    padding: 8px;
    border-radius: 6px;
    border: none;
    font-size: 14px;
}

.build {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    opacity: 0.4;
}
</style>
</head>

<body>

<div class="app">

    <div class="card" id="card">Loading...</div>

    <div class="counter" id="counter"></div>

    <div class="controls">
        <button onclick="previousCard()">Previous</button>
        <button onclick="nextCard()">Next</button>
        <button onclick="shuffleCards()">Shuffle</button>
        <button onclick="openModal()">Edit</button>
    </div>

    <div class="build">For my Wife, with Love — Husband of yours 💛</div>

</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <label>Front</label>
        <textarea id="editFront"></textarea>

        <label>Back</label>
        <textarea id="editBack"></textarea>

        <button onclick="saveEdit()">Save</button>
        <button id="clearBtn" onclick="clearOrUndo()">Clear</button>
        <button onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>

let cards = JSON.parse(localStorage.getItem("cards")) || [
    { front: "Capital of France?", back: "Paris" },
    { front: "2 + 2?", back: "4" }
];

let current = 0;
let showingFront = true;

let startX = 0;
let isDragging = false;

let previousFront = "";
let previousBack = "";
let cleared = false;

const cardEl = document.getElementById("card");
const counterEl = document.getElementById("counter");
const modal = document.getElementById("modal");
const clearBtn = document.getElementById("clearBtn");

function save() {
    localStorage.setItem("cards", JSON.stringify(cards));
}

function showCard() {
    if (cards.length === 0) {
        cardEl.innerText = "No cards";
        counterEl.innerText = "";
        return;
    }

    cardEl.innerText = showingFront
        ? cards[current].front
        : cards[current].back;

    counterEl.innerText = `Card ${current + 1} of ${cards.length}`;
}

function flipCard() {
    showingFront = !showingFront;
    showCard();
}

function nextCard() {
    current = (current + 1) % cards.length;
    showingFront = true;
    showCard();
}

function previousCard() {
    current = (current - 1 + cards.length) % cards.length;
    showingFront = true;
    showCard();
}

function shuffleCards() {
    cards.sort(() => Math.random() - 0.5);
    current = 0;
    showingFront = true;
    save();
    showCard();
}

function openModal() {
    document.getElementById("editFront").value = cards[current].front;
    document.getElementById("editBack").value = cards[current].back;
    cleared = false;
    clearBtn.innerText = "Clear";
    modal.style.display = "flex";
}

function closeModal() {
    modal.style.display = "none";
}

function saveEdit() {
    cards[current].front = document.getElementById("editFront").value;
    cards[current].back = document.getElementById("editBack").value;
    save();
    closeModal();
    showCard();
}

function clearOrUndo() {
    const frontField = document.getElementById("editFront");
    const backField = document.getElementById("editBack");

    if (!cleared) {
        previousFront = frontField.value;
        previousBack = backField.value;
        frontField.value = "";
        backField.value = "";
        clearBtn.innerText = "Undo";
        cleared = true;
    } else {
        frontField.value = previousFront;
        backField.value = previousBack;
        clearBtn.innerText = "Clear";
        cleared = false;
    }
}

/* ----- SWIPE + TAP LOGIC ----- */

cardEl.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
    isDragging = false;
});

cardEl.addEventListener("touchmove", e => {
    let diff = e.touches[0].clientX - startX;
    if (Math.abs(diff) > 10) {
        isDragging = true;
        cardEl.style.transform = `translateX(${diff}px)`;
    }
});

cardEl.addEventListener("touchend", e => {
    let diff = e.changedTouches[0].clientX - startX;

    cardEl.style.transform = "";

    if (isDragging && Math.abs(diff) > 60) {
        if (diff > 0) previousCard();
        else nextCard();
    } else {
        flipCard();
    }

    isDragging = false;
});

/* Disable double-tap zoom */
let lastTap = 0;
cardEl.addEventListener("touchend", function (e) {
    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTap;
    if (tapLength < 300 && tapLength > 0) {
        e.preventDefault();
    }
    lastTap = currentTime;
});

showCard();

</script>

</body>
</html>
