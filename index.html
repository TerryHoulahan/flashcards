<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

.header {
    padding: 10px;
    text-align: center;
    background: #222;
    display: flex;
    justify-content: space-between;
}

button {
    padding: 10px;
    font-size: 14px;
    cursor: pointer;
}

.main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: 90%;
    max-width: 500px;
    height: 60vh;
    border: 2px solid #444;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    font-size: 22px;
    background: #1c1c1c;
}

.controls {
    padding: 10px;
    text-align: center;
    background: #222;
}
</style>
</head>

<body>

<div class="header">
    <button onclick="toggleEdit()">Edit</button>
    <button onclick="addCard()">Add Card</button>
</div>

<div class="main">
    <div class="card" onclick="flipCard()" id="card"></div>
</div>

<div class="controls">
    <button onclick="nextCard()">Next</button>
</div>

<script>
let cards = JSON.parse(localStorage.getItem("flashcards")) || [
    { front: "Capital of France?", back: "Paris" }
];

let current = 0;
let showingFront = true;
let editMode = false;

function save() {
    localStorage.setItem("flashcards", JSON.stringify(cards));
}

function showCard() {
    const card = document.getElementById("card");

    if (editMode) {
        card.innerHTML = `
            <div>
                <div>Front:</div>
                <input id="frontInput" value="${cards[current].front}" />
                <div>Back:</div>
                <input id="backInput" value="${cards[current].back}" />
                <br><br>
                <button onclick="saveEdit()">Save</button>
            </div>
        `;
        return;
    }

    card.innerText = showingFront
        ? cards[current].front
        : cards[current].back;
}

function flipCard() {
    if (editMode) return;
    showingFront = !showingFront;
    showCard();
}

function nextCard() {
    current = (current + 1) % cards.length;
    showingFront = true;
    showCard();
}

function toggleEdit() {
    editMode = !editMode;
    showCard();
}

function saveEdit() {
    cards[current].front = document.getElementById("frontInput").value;
    cards[current].back = document.getElementById("backInput").value;
    save();
    editMode = false;
    showCard();
}

function addCard() {
    cards.push({ front: "New Question", back: "New Answer" });
    current = cards.length - 1;
    save();
    showCard();
}

showCard();
</script>

</body>
</html>
