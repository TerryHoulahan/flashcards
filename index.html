<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
    }

    .card {
        width: 90%;
        max-width: 600px;
        height: 60vh;
        background: #222;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 2rem;
        padding: 20px;
        cursor: pointer;
        user-select: none;
        transition: transform 0.2s ease;
    }

    .controls {
        margin-top: 20px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
    }

    button {
        padding: 10px 15px;
        font-size: 16px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
    }

    .counter {
        margin-top: 10px;
        font-size: 14px;
        opacity: 0.7;
    }

    .build {
        position: fixed;
        bottom: 5px;
        right: 10px;
        font-size: 12px;
        opacity: 0.4;
    }
</style>
</head>

<body>

<div class="card" id="card">Loading...</div>

<div class="counter" id="counter"></div>

<div class="controls">
    <button onclick="previousCard()">Previous</button>
    <button onclick="nextCard()">Next</button>
    <button onclick="shuffleCards()">Shuffle</button>
    <button onclick="addCard()">Add Card</button>
</div>

<div class="build">
    BUILD: 2026-02-16-v2
</div>

<script>
let cards = JSON.parse(localStorage.getItem("flashcards")) || [
    { front: "Capital of France?", back: "Paris" },
    { front: "2 + 2?", back: "4" }
];

let current = 0;
let showingFront = true;
let startX = 0;

const cardEl = document.getElementById("card");
const counterEl = document.getElementById("counter");

function saveCards() {
    localStorage.setItem("flashcards", JSON.stringify(cards));
}

function showCard() {
    if (cards.length === 0) {
        cardEl.innerText = "No cards. Add one.";
        counterEl.innerText = "";
        return;
    }

    cardEl.innerText = showingFront
        ? cards[current].front
        : cards[current].back;

    counterEl.innerText = `Card ${current + 1} of ${cards.length}`;
}

function flipCard() {
    showingFront = !showingFront;
    showCard();
}

function nextCard() {
    current = (current + 1) % cards.length;
    showingFront = true;
    showCard();
}

function previousCard() {
    current = (current - 1 + cards.length) % cards.length;
    showingFront = true;
    showCard();
}

function shuffleCards() {
    for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    current = 0;
    showingFront = true;
    saveCards();
    showCard();
}

function addCard() {
    let front = prompt("Front (question):");
    if (!front) return;

    let back = prompt("Back (answer):");
    if (!back) return;

    cards.push({ front, back });
    saveCards();
    current = cards.length - 1;
    showingFront = true;
    showCard();
}

cardEl.addEventListener("click", flipCard);

cardEl.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

cardEl.addEventListener("touchend", e => {
    let endX = e.changedTouches[0].clientX;
    let diff = endX - startX;

    if (diff > 50) {
        previousCard();
    } else if (diff < -50) {
        nextCard();
    }
});

showCard();
</script>

</body>
</html>
